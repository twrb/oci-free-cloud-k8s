apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: oauth2
  namespace: oauth2
spec:
  interval: 5m
  url: https://oauth2-proxy.github.io/manifests
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2
  namespace: oauth2
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: oauth2
  chart:
    spec:
      chart: oauth2-proxy
      version: '8.3.1'
      sourceRef:
        kind: HelmRepository
        name: oauth2
      interval: 5m
  releaseName: oauth2